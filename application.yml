eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URLS:http://localhost:8761/eureka/,http://localhost:8762/eureka/}
    registry-fetch-interval-seconds: 5
  instance:
    hostname: ${SERVICE_HOST:localhost}
    prefer-ip-address: false
    instance-id: ${INSTANCE_ID:${spring.application.name}:${server.port}}
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15
management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,hystrix.stream
  endpoint:
    health:
      show-details: always
feign:
  hystrix:
    enabled: true
ribbon:
  ConnectTimeout: 500
  ReadTimeout: 1500
  MaxAutoRetries: 0
  MaxAutoRetriesNextServer: 0
  ServerListRefreshInterval: 3000
hystrix:
  command:
    default:
      execution:
        isolation:
          thread:
            timeoutInMilliseconds: 8000
      circuitBreaker:
        requestVolumeThreshold: 5
        errorThresholdPercentage: 50
        sleepWindowInMilliseconds: 5000
  threadpool:
    default:
      coreSize: 10
