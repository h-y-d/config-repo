server:
  port: ${SERVER_PORT:8080}
library:
  gateway-token: ${GATEWAY_TOKEN:library-demo-token}
zuul:
  prefix: /api
  ignored-services: '*'
  sensitive-headers: Cookie,Set-Cookie,Authorization
  retryable: false
  routes:
    users:
      path: /users/**
      service-id: user-service
      strip-prefix: false
    books:
      path: /books/**
      service-id: book-service
      strip-prefix: false
    borrows:
      path: /borrows/**
      service-id: borrow-service
      strip-prefix: false
    user-demo:
      path: /user-service/**
      service-id: user-service
      strip-prefix: true
    book-demo:
      path: /book-service/**
      service-id: book-service
      strip-prefix: true
    borrow-demo:
      path: /borrow-service/**
      service-id: borrow-service
      strip-prefix: true
